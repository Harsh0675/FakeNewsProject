<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fake News Detector</title>
<style>
body{margin:0;font-family:system-ui;background:#0b1020;color:#f4f7ff} .wrap{max-width:900px;margin:auto;padding:40px 20px}.card{background:#151c31;border:1px solid #2b3655;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0005}h1{margin:0 0 8px;font-size:34px}p{color:#aab5d0}textarea{width:100%;min-height:170px;box-sizing:border-box;background:#0d1426;color:white;border:1px solid #34405f;border-radius:14px;padding:16px;font-size:16px;resize:vertical}button{margin-top:14px;width:100%;padding:15px;border:0;border-radius:12px;background:#5b7cff;color:white;font-size:16px;font-weight:700}button:disabled{opacity:.6}.result{margin-top:22px;padding:20px;border-radius:14px;background:#0d1426;display:none}.label{font-size:26px;font-weight:800}.bar{height:12px;background:#29334e;border-radius:10px;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:#5b7cff;transition:.4s}.meta{display:flex;justify-content:space-between;color:#aab5d0}.note{font-size:13px;margin-top:18px;color:#8793af}</style>
</head>
<body><main class="wrap"><div class="card"><h1>📰 Fake News Detector</h1><p>Enter a news claim and get an instant machine-learning prediction.</p><textarea id="text" placeholder="Paste a news claim or article here..."></textarea><button id="btn" onclick="analyze()">Analyze News</button><div id="result" class="result"><div id="label" class="label"></div><div class="bar"><div id="fill" class="fill"></div></div><div class="meta"><span>Confidence</span><strong id="confidence"></strong></div><p id="detail"></p></div><div class="note">Educational AI tool: a model prediction is not proof that a claim is true or false. Always verify important claims using trustworthy sources.</div></div></main>
<script>
async function analyze(){const text=document.getElementById('text').value.trim();if(!text)return alert('Enter a news claim first.');const b=document.getElementById('btn');b.disabled=true;b.textContent='Analyzing…';try{const r=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');document.getElementById('result').style.display='block';document.getElementById('label').textContent=d.label==='REAL'?'LIKELY REAL':'LIKELY FAKE';document.getElementById('confidence').textContent=(d.confidence*100).toFixed(1)+'%';document.getElementById('fill').style.width=(d.confidence*100)+'%';document.getElementById('detail').textContent='Model prediction based on learned language patterns. It does not independently verify the claim.'}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='Analyze News'}}
</script></body></html>
